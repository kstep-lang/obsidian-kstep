name: Release

# Obsidian Community Plugin Store convention: tags WITHOUT "v" prefix
# e.g. "0.1.0", NOT "v0.1.0" (same convention as the sibling obsidian-kuml repo).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Required for actions/attest-build-provenance to sign the release assets so
  # users can cryptographically verify they were built from this repo.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build plugin (production)
        run: npm run build

      - name: Verify bundle size
        run: |
          SIZE=$(stat -c%s main.js 2>/dev/null || stat -f%z main.js)
          echo "main.js size: ${SIZE} bytes"
          # Guard against accidentally bundling something heavy (e.g. the
          # @codemirror/* packages marked external in esbuild.config.mjs).
          #
          # Raised from 500 KB to 800 KB in the GLB-3D-viewer wave: three.js
          # (0.183.2) + its GLTFLoader/OrbitControls examples are now a
          # legitimate bundled dependency (esbuild.config.mjs does not mark
          # `three` external — it is deliberately shipped in main.js so the
          # plugin never needs a runtime CDN fetch, see that wave's
          # implementation report §1). Verified minified production size at
          # the time of this change: 631,696 bytes — 800 KB leaves headroom
          # for normal three.js patch bumps without moving this gate again,
          # while still catching a genuinely new heavy dependency getting
          # bundled by accident.
          if [ "$SIZE" -gt 800000 ]; then
            echo "ERROR: main.js > 800 KB — an unexpected dependency may have been bundled"
            exit 1
          fi

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          # Create or update the release (idempotent re-run)
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists — uploading assets"
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
